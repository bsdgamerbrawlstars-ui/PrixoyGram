name: Build PrixoyGram
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 1
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-

    - name: Force Update Submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive

    # ГЕНЕРАЦИЯ КЛЮЧА ПОДПИСИ
    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias prixoygram -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=PrixoyGram, OU=Dev, O=Prixoy, L=Kiev, S=Kiev, C=UA"
        cp release.keystore TMessagesProj/config/
        
    # ДОБАВЛЯЕМ ПАРОЛИ В GRADLE.PROPERTIES
    - name: Configure Gradle Properties
      run: |
        echo "RELEASE_STORE_FILE=config/release.keystore" >> gradle.properties
        echo "RELEASE_STORE_PASSWORD=123456" >> gradle.properties
        echo "RELEASE_KEY_ALIAS=prixoygram" >> gradle.properties
        echo "RELEASE_KEY_PASSWORD=123456" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx4g" >> gradle.properties
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build APK
      run: ./gradlew assembleAfatRelease
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PrixoyGram-APK
        path: TMessagesProj/build/outputs/apk/afat/release/*.apk
