name: Build PrixoyGram
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 1
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    # ЭТОТ БЛОК СОХРАНЯЕТ СКАЧАННЫЕ БИБЛИОТЕКИ (УСКОРЯЕТ СБОРКУ)
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-

    - name: Force Update Submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    # СБОРКА ТОЛЬКО ДЛЯ ARM64 И ОГРАНИЧЕНИЕ ПАМЯТИ (ЧТОБЫ НЕ ВЫЛЕТАЛО)
    - name: Build APK (ARM64)
      run: ./gradlew assembleArm64Release --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PrixoyGram-APK
        path: TMessagesProj/build/outputs/apk/arm64/release/*.apk
